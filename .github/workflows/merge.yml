name: Update Index

on:
  push:
    branches: [main]
    paths:
      - "skills/**"

permissions:
  contents: write

jobs:
  update-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Merge index.json
        env:
          PUSH_BEFORE: ${{ github.event.before }}
        run: node scripts/merge-index.mjs

      - name: Commit updated index.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.json
          git diff --cached --quiet || git commit -m "chore: update index.json"
          git push
