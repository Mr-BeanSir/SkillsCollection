name: CI

on:
  pull_request:
    branches: [main]
    paths:
      - "skills/**"

permissions:
  contents: write
  pull-requests: read

jobs:
  validate-and-merge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Get changed files
        id: changed
        run: |
          FILES=$(git diff --name-only origin/main...HEAD -- 'skills/*.json' | tr '\n' ' ')
          echo "files=$FILES" >> $GITHUB_OUTPUT
          echo "变更文件: $FILES"

      - name: Validate JSON
        if: steps.changed.outputs.files != ''
        run: node scripts/validate.mjs ${{ steps.changed.outputs.files }}

      - name: Merge index.json
        if: steps.changed.outputs.files != ''
        run: node scripts/merge-index.mjs

      - name: Commit updated index.json
        if: steps.changed.outputs.files != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.json
          git diff --cached --quiet || git commit -m "chore: update index.json"
          git push
